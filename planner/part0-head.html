<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>波次规划工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Cpath d='M10 34c8-10 12-10 20 0s12 10 24-2' stroke='%237ee787' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 46c8-10 12-10 20 0s12 10 24-2' stroke='%2358a6ff' stroke-width='5' fill='none' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f14;
  --bg2:#0f141b;
  --fg:#c9d1d9;
  --dim:#7d8590;
  --line:#21262d;
  --accent:#58a6ff;
  --ok:#3fb950;
  --warn:#d29922;
  --err:#f85149;
  --prompt:#7ee787;
  --gutter:0px;
}
/* 界面主题（光耀紫府 = 原 Dracula 色板） */
body[data-theme="dracula"]{
  --bg:#282a36;--bg2:#21222c;--fg:#f8f8f2;--dim:#6272a4;--line:#44475a;
  --accent:#bd93f9;--ok:#50fa7b;--warn:#f1fa8c;--err:#ff5555;--prompt:#8be9fd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","LXGW WenKai Mono",
    ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  font-size:13.5px;line-height:1.5;
  display:flex;flex-direction:column;
}
::selection{background:#1c3a5e;color:#e6edf3}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2d333b;border:2px solid var(--bg);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3d444d}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ===== 页面容器：内容决定最大宽度，超宽时居中、背景统一 ===== */
.shell{max-width:var(--shellmax, 1156px);margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;padding:0 14px}
.bodywrap{flex:1;display:flex;flex-direction:row;min-height:0;min-width:0;align-items:stretch}

/* ===== 左侧操作栏 ===== */
/* 界面主题：黄天当立 */
body[data-theme="yellow"]{
  --bg:#1a1408;--bg2:#241b0a;--fg:#f5e6c8;--dim:#a08c5f;--line:#4a3b1a;
  --accent:#ffd700;--ok:#7ec850;--warn:#ff9f1c;--err:#ff5349;--prompt:#ffe066;
}
body[data-theme="yellow"] .twrap,
body[data-theme="yellow"] .pt,
body[data-theme="yellow"] .pt .urowe{background:#1f1708}
body[data-theme="yellow"] .pt th{background:#2c210c}
body[data-theme="yellow"] .bb:hover:not(:disabled){background:#3a2d12}
body[data-theme="yellow"] .side-wms .bb.wms-mode.sel{color:#1a1200}
/* 界面主题：蟠青丛翠 */
body[data-theme="jade"]{
  --bg:#0c1a16;--bg2:#12241f;--fg:#d8efe4;--dim:#6f9487;--line:#23473d;
  --accent:#2ee6a8;--ok:#58d68d;--warn:#e8c24a;--err:#ff6b57;--prompt:#9be8c8;
}
body[data-theme="jade"] .twrap,
body[data-theme="jade"] .pt,
body[data-theme="jade"] .pt .urowe{background:#101f1a}
body[data-theme="jade"] .pt th{background:#182a24}
body[data-theme="jade"] .bb:hover:not(:disabled){background:#1e3a30}
body[data-theme="jade"] .side-wms .bb.wms-mode.sel{color:#04120e}
/* 界面主题：万丈红尘 */
body[data-theme="reddust"]{
  --bg:#1a0d0d;--bg2:#241212;--fg:#f5dddd;--dim:#a07c7c;--line:#4a2323;
  --accent:#ff4d5e;--ok:#5bd07a;--warn:#ffb454;--err:#ff3b3b;--prompt:#ff8fa3;
}
body[data-theme="reddust"] .twrap,
body[data-theme="reddust"] .pt,
body[data-theme="reddust"] .pt .urowe{background:#1f1010}
body[data-theme="reddust"] .pt th{background:#2c1717}
body[data-theme="reddust"] .bb:hover:not(:disabled){background:#3a1d1d}
body[data-theme="reddust"] .side-wms .bb.wms-mode.sel{color:#1a0505}
/* 界面主题：海晏河清 */
body[data-theme="seaclear"]{
  --bg:#06121a;--bg2:#0a1c28;--fg:#cfe6f2;--dim:#6e8fa3;--line:#1c3a4d;
  --accent:#35c9ff;--ok:#4fd6a0;--warn:#f0c45a;--err:#ff5f6d;--prompt:#8ee8ff;
}
body[data-theme="seaclear"] .twrap,
body[data-theme="seaclear"] .pt,
body[data-theme="seaclear"] .pt .urowe{background:#081826}
body[data-theme="seaclear"] .pt th{background:#0f2433}
body[data-theme="seaclear"] .bb:hover:not(:disabled){background:#143046}
body[data-theme="seaclear"] .side-wms .bb.wms-mode.sel{color:#03101a}
.side{
  flex:0 0 200px;width:200px;min-width:0;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:14px;padding:12px 12px;
  /* 配置面板从按钮下方弹出需覆盖表格，故不禁裁切（内部文字用 ellipsis 自行约束） */
  overflow:visible;
}
.side-row{display:flex;flex-direction:column;gap:5px;min-width:0}
.side-btns{flex-direction:row;gap:8px}
.side-btns .bb{flex:1;padding:5px 0;text-align:center;white-space:nowrap}
.side-btns .cfg-wrap{flex:1;display:flex;min-width:0;position:relative}
.side-btns .cfg-wrap .bb{width:100%}
.side-mode,.side-browser{flex-direction:row;align-items:center;gap:6px;white-space:nowrap}
.side-mode .dim,.side-browser .dim{flex:0 0 auto}
.side-mode .mode-toggle,.side-browser .mode-toggle{font-size:13px;font-weight:700}
/* WMS 联动区 */
.side-wms{gap:8px}
.side-wms-head{display:flex;align-items:center;justify-content:space-between}
.wms-dot{width:9px;height:9px;border-radius:50%;background:#2d333b;flex:0 0 auto}
.wms-dot.ok{background:var(--ok)}
.wms-dot.err{background:var(--err)}
.side-wms .bb{width:100%;text-align:center}
.side-wms .bb.wms-mode.sel{background:var(--accent);color:#0b1016;border-color:var(--accent);font-weight:700}
.side-wms .bb.run{font-weight:700;border-color:var(--accent)}
.side-wms textarea{
  background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:2px;
  font:inherit;font-size:12px;resize:vertical;padding:4px 6px;outline:none;width:100%;min-height:64px;
}
.side-wms textarea:focus{border-color:var(--accent)}
.side-wms textarea:disabled{opacity:.5}
/* 底部 WMS 任务面板 */
.wms-panel{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);min-width:0}
.wms-panel[hidden]{display:none}
.wms-panel-bar{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:12.5px;min-width:0}
.wms-state{font-weight:700;white-space:nowrap}
.wms-state.running{color:var(--accent)}
.wms-state.queued{color:var(--accent)}
.wms-state.succeeded{color:var(--ok)}
.wms-state.partial{color:var(--warn)}
.wms-state.failed{color:var(--err)}
.wms-state.cancelled{color:var(--dim)}
.wms-msg{color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* WMS 任务日志：位于操作栏内（取消任务按钮下方），宽度=操作栏宽，自动滚动刷新 */
.side-wms .wms-log{
  flex:1 1 auto;min-height:96px;max-height:340px;overflow-y:auto;
  width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:2px;
  background:var(--bg);font-size:11px;line-height:1.6;
}
.wms-log .ev{white-space:pre-wrap;word-break:break-all}
.wms-log .ev.link a{color:var(--accent);text-decoration:underline;word-break:break-all}
.wms-log .ev.link a:hover{color:var(--ok)}
.wms-log .ev{white-space:pre-wrap;word-break:break-all}
.wms-log .ev.failed{color:var(--err)}
.wms-log .ev.completed{color:var(--ok)}
.wms-log .ev.segment_warning{color:var(--warn)}
.wms-log .ev.completed_with_warnings{color:var(--warn)}

.side-status{gap:6px}
.side-status .status{max-width:100%;white-space:normal;word-break:break-all;line-height:1.5}
.side-spacer{flex:1}
.spacer{flex:1}

.dim{color:var(--dim)}
.ok{color:var(--ok);font-weight:700}
.fail{color:var(--err);font-weight:700}
.mode-toggle{color:var(--accent);font-weight:700;cursor:pointer;user-select:none;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.mode-toggle:hover{color:var(--fg)}
.mode-toggle.on{color:var(--ok)}
.status{color:var(--dim);font-size:12.5px;max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
.cfg-wrap{position:relative}
/* 选项列表固定从按钮下方弹出（始终向下） */
.cfg-list{
  position:absolute;top:calc(100% + 3px);left:0;width:max-content;min-width:176px;z-index:999;
  margin:0;padding:4px 0;list-style:none;max-height:264px;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line);border-radius:2px;
  box-shadow:0 6px 18px rgba(0,0,0,.55);
}
.cfg-list[hidden]{display:none}
.cfg-list li{padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.cfg-list li:hover{background:#18222e;color:var(--fg)}
.cfg-list li.on{color:var(--ok);font-weight:700}
.bb{
  background:transparent;border:1px solid var(--line);color:var(--accent);
  font:inherit;font-size:12.5px;padding:3px 11px;cursor:pointer;
  border-radius:2px;letter-spacing:.5px;
}
.bb:hover:not(:disabled){border-color:var(--accent);color:var(--fg);background:#121a24}
.bb:disabled{opacity:.35;cursor:not-allowed}

/* ===== 主区 ===== */
.term{flex:1;display:flex;flex-direction:column;min-height:0}
/* 固定预留滚动条槽位：纵向滚动条出现时不再挤压表格容器宽度 */
.out{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 0 18px;min-height:0;scrollbar-gutter:stable}

/* ===== 合并表：参数（左）+ 渠道分段总览（右） ===== */
.twrap{overflow-x:auto;width:924px;max-width:100%;margin:0}
/* 表格总宽由列宽组决定（104 + 60*6 + 114*4 = 920）：
   table-layout:fixed 下实际渲染宽 = 列宽组和，border-collapse 在 Chrome 下会再多 1px，
   故容器留 3px 余量（924）避免无用横向滚动条；
   黑色底版直接画在表格上（而非容器），保证底版与表格外边框严丝合缝 */
.pt{border-collapse:collapse;width:918px;min-width:918px;table-layout:fixed;background:#0d1219}
.pt th,.pt td{
  border:1px solid var(--line);padding:5px 8px;font:inherit;
  vertical-align:middle;text-align:center;white-space:nowrap;
}
.pt th{color:var(--dim);font-weight:700;background:#0f141b}
.pt td.left{text-align:left}
.pt .prow td:first-child{padding-left:12px}
.pt td.num{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.pt td.segtd{white-space:normal;text-align:left;vertical-align:middle;padding:3px 4px;overflow:hidden}
.pt .urowe{color:var(--dim);background:#0d1219}
/* 渠道行：上下各留半个行高，内容顶部对齐 */
.pt .prow td{vertical-align:top;padding-top:11px;padding-bottom:11px}
.pt .prow td.segtd{padding-top:11px;padding-bottom:11px;padding-left:6px;padding-right:6px}
.type-count .wc{color:var(--accent);font-weight:700}
.type-count .oc{color:var(--ok);font-weight:700}

.ch-cell{display:flex;align-items:center;gap:7px}
/* Powerlevel10k 风格渠道标签：等宽彩底 + 黑色字体 + 右侧尖角；否掉后变灰 */
.chn{
  display:inline-flex;align-items:center;justify-content:center;height:22px;position:relative;
  width:68px;padding:0 9px;margin-right:9px;
  background:var(--chc,#3f4756);color:#000;font-weight:700;
  cursor:grab;user-select:none;outline:none;letter-spacing:.3px;
}
.chn::after{
  content:'';position:absolute;left:100%;top:0;
  border-style:solid;border-width:11px 0 11px 9px;
  border-color:transparent transparent transparent var(--chc,#3f4756);
}
.chn:active{cursor:grabbing}
.chn:focus{outline:none;filter:brightness(1.12)}
.chn.dragging{opacity:.35}
.prow.drop-before td{box-shadow:inset 0 2px 0 0 var(--accent)}
.prow.drop-after td{box-shadow:inset 0 -2px 0 0 var(--accent)}

.tog{cursor:pointer;user-select:none;color:var(--dim)}
.tog:hover{background:#18222e;outline:1px solid var(--line)}
.tog.on{color:var(--ok)}
.tog.some{color:var(--ok)}
.tog.off{color:var(--dim)}

.arr{color:var(--accent);cursor:pointer;user-select:none;padding:0 2px;font-weight:700}
.arr:hover{background:#18222e;outline:1px solid var(--line)}
.arr.limit{color:#2d333b;cursor:default}
.arr.limit:hover{background:transparent;outline:none}

/* 吸收循环 */
.aval{color:var(--warn);cursor:pointer;user-select:none;font-weight:700;display:inline-block}
.aval:hover{background:#18222e;outline:1px solid var(--line)}
/* 渠道否掉：其可调参数与分段一并变灰 */
.prow.off .arr,.prow.off .pval,.prow.off .aval{color:var(--dim)}

.pt .urowe td.segtd{text-align:center}
/* 分段行：点击文字切换勾选（白=选中导出，灰=未选） */
.seg-line{white-space:nowrap;line-height:1.75;width:max-content;max-width:100%;cursor:pointer}
.seg-name{font-weight:600;color:var(--fg);letter-spacing:-0.15px}
.seg-line.off .seg-name{color:var(--dim)}
.seg-line.waved .seg-name{color:var(--ok)}
.seg-line:hover .seg-name{background:#18222e;outline:1px solid var(--line)}
.cell-dim{color:var(--dim)}

@media (max-width:760px){
  body{font-size:12.5px}
}
</style>
</head>
