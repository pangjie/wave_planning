<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>波次规划工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Cpath d='M10 34c8-10 12-10 20 0s12 10 24-2' stroke='%237ee787' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 46c8-10 12-10 20 0s12 10 24-2' stroke='%2358a6ff' stroke-width='5' fill='none' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#090812;
  --bg2:#11101d;
  --surface:#171426;
  --surface2:#1e1930;
  --fg:#f7f4ff;
  --dim:#958eaa;
  --muted:#655e78;
  --line:#2d2742;
  --accent:#a78bfa;
  --accent2:#22d3ee;
  --ok:#5ee6a8;
  --warn:#f7c76c;
  --err:#ff6b81;
  --prompt:#67e8f9;
  --shadow:rgba(0,0,0,.34);
  --radius:18px;
  --gutter:0px;
  color-scheme:dark;
}
body[data-theme="dracula"]{
  --bg:#090812;--bg2:#11101d;--surface:#171426;--surface2:#1e1930;
  --fg:#f7f4ff;--dim:#958eaa;--muted:#655e78;--line:#2d2742;
  --accent:#a78bfa;--accent2:#22d3ee;--ok:#5ee6a8;--warn:#f7c76c;--err:#ff6b81;--prompt:#67e8f9;
}
body[data-theme="yellow"]{
  --bg:#0e0c07;--bg2:#171309;--surface:#1e190c;--surface2:#28200d;
  --fg:#fff7d6;--dim:#ad9c69;--muted:#71663f;--line:#3c3217;
  --accent:#ffd43b;--accent2:#ff9f1c;--ok:#9ee56f;--warn:#ffb347;--err:#ff6b57;--prompt:#ffe66d;
}
body[data-theme="jade"]{
  --bg:#06100d;--bg2:#0a1915;--surface:#0d211b;--surface2:#102b23;
  --fg:#e5fff5;--dim:#78a897;--muted:#486d60;--line:#1d4438;
  --accent:#2ee6a8;--accent2:#48cae4;--ok:#78f0a7;--warn:#e8c24a;--err:#ff7866;--prompt:#9be8c8;
}
body[data-theme="reddust"]{
  --bg:#110707;--bg2:#1b0c0d;--surface:#251012;--surface2:#311317;
  --fg:#fff0f1;--dim:#b18488;--muted:#765356;--line:#4a2228;
  --accent:#ff4d6d;--accent2:#ff8fa3;--ok:#66e18a;--warn:#ffbd68;--err:#ff3d52;--prompt:#ff9eb0;
}
body[data-theme="seaclear"]{
  --bg:#041018;--bg2:#071a25;--surface:#0a2230;--surface2:#0c2c3d;
  --fg:#e4f8ff;--dim:#7da6ba;--muted:#4a7082;--line:#1b4558;
  --accent:#35c9ff;--accent2:#5eead4;--ok:#58e0a9;--warn:#f4cd6b;--err:#ff6d7a;--prompt:#8ee8ff;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%}
html{background:var(--bg)}
body{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 32%),
    radial-gradient(circle at 92% 110%,color-mix(in srgb,var(--accent2) 11%,transparent),transparent 34%),
    var(--bg);
  color:var(--fg);
  font-family:"Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","LXGW WenKai Mono",
    ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,textarea{font:inherit}
button:focus-visible,[role="button"]:focus-visible,[role="checkbox"]:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent2);
  outline-offset:2px;
}
::selection{background:color-mix(in srgb,var(--accent) 48%,transparent);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--line) 72%,var(--dim));border:3px solid transparent;border-radius:10px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);border:2px solid transparent;background-clip:padding-box}

/* Ambient scene */
.app-backdrop{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.app-backdrop::before{
  content:'';position:absolute;inset:-38%;opacity:.13;filter:blur(115px);mix-blend-mode:screen;
  background:conic-gradient(from 40deg at 50% 50%,transparent 0 13%,var(--accent) 19%,transparent 29% 53%,var(--accent2) 62%,transparent 72% 100%);
  animation:aurora-spin 34s linear infinite;
}
.app-backdrop::after{
  content:'';position:absolute;inset:-25% 0;
  background:linear-gradient(115deg,transparent 22%,color-mix(in srgb,var(--accent2) 5%,transparent) 38%,transparent 52%);
  transform:translateX(-58%);animation:sky-sweep 12s ease-in-out infinite;
}
.app-backdrop .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2;animation:orb-float 16s ease-in-out infinite alternate;will-change:transform}
.orb-a{width:560px;height:560px;left:-220px;top:-270px;background:var(--accent)}
.orb-b{width:480px;height:480px;right:-160px;bottom:-240px;background:var(--accent2);animation-delay:-6s!important}
.grid-glow{
  position:absolute;inset:0;
  background-image:linear-gradient(color-mix(in srgb,var(--fg) 2.8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--fg) 2.8%,transparent) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 90%);
  animation:grid-drift 18s linear infinite;
}
@keyframes orb-float{to{transform:translate3d(42px,28px,0) scale(1.08)}}
@keyframes aurora-spin{to{transform:rotate(1turn) scale(1.08)}}
@keyframes sky-sweep{0%,22%{transform:translateX(-58%)}72%,100%{transform:translateX(62%)}}
@keyframes grid-drift{to{background-position:42px 42px}}

/* App shell */
.shell{
  position:relative;z-index:1;
  width:100%;max-width:1640px;height:100%;margin:0 auto;padding:18px 22px 24px;
  display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;
  animation:shell-arrive .7s cubic-bezier(.2,.75,.25,1) both;
}
.app-header{
  position:relative;z-index:100;flex:0 0 auto;min-height:68px;padding:10px 14px 10px 18px;
  display:flex;align-items:center;gap:24px;
  background:
    radial-gradient(circle at 10% 0,color-mix(in srgb,var(--accent) 10%,transparent),transparent 31%),
    linear-gradient(115deg,color-mix(in srgb,var(--bg2) 92%,transparent),color-mix(in srgb,var(--surface) 78%,transparent),color-mix(in srgb,var(--bg2) 92%,transparent));
  background-size:100% 100%,220% 220%;
  border:1px solid color-mix(in srgb,var(--line) 86%,var(--accent));
  border-radius:var(--radius);
  box-shadow:0 24px 70px var(--shadow),0 0 34px color-mix(in srgb,var(--accent) 7%,transparent),inset 0 1px 0 color-mix(in srgb,var(--fg) 7%,transparent);
  backdrop-filter:blur(22px) saturate(130%);
  animation:panel-chroma 12s ease-in-out infinite;
}
.app-header::after{
  content:'';position:absolute;left:24px;right:24px;top:-1px;height:2px;border-radius:999px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);background-size:220% 100%;
  box-shadow:0 0 15px color-mix(in srgb,var(--accent) 44%,transparent);animation:edge-flow 5s linear infinite;
}
.brand{display:flex;align-items:center;min-width:230px;user-select:none}.brand strong{font-size:20px;letter-spacing:.4px;background:linear-gradient(95deg,var(--fg),color-mix(in srgb,var(--accent) 68%,white),var(--accent2),var(--fg));background-size:240% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 0 24px color-mix(in srgb,var(--accent) 18%,transparent);animation:title-flow 7s linear infinite}
.header-actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px}

.bodywrap{position:relative;z-index:1;flex:1;display:flex;gap:14px;min-width:0;min-height:0;align-items:stretch}
.side,.term{
  background:
    radial-gradient(circle at 0 0,color-mix(in srgb,var(--accent) 7%,transparent),transparent 28%),
    radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--accent2) 5%,transparent),transparent 32%),
    color-mix(in srgb,var(--bg2) 86%,transparent);
  border:1px solid color-mix(in srgb,var(--line) 86%,var(--accent));border-radius:var(--radius);
  box-shadow:0 24px 70px color-mix(in srgb,var(--shadow) 72%,transparent),0 0 36px color-mix(in srgb,var(--accent) 5%,transparent),inset 0 1px 0 color-mix(in srgb,var(--fg) 6%,transparent);
  backdrop-filter:blur(22px) saturate(135%);
}

@keyframes shell-arrive{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
@keyframes panel-chroma{0%,100%{background-position:0 0,0 50%}50%{background-position:0 0,100% 50%}}
@keyframes edge-flow{to{background-position:220% 0}}
@keyframes title-flow{to{background-position:240% 0}}

/* Shared buttons and menus */
.bb{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);color:var(--fg);
  font-size:14px;font-weight:750;letter-spacing:.2px;cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,background .16s ease,color .16s ease,box-shadow .16s ease;
}
.bb::after{content:'';position:absolute;z-index:-1;top:-65%;bottom:-65%;left:-76%;width:42%;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,white 22%,transparent),transparent);transform:skewX(-20deg);transition:left .52s cubic-bezier(.2,.7,.2,1)}
.bb:hover:not(:disabled){transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 70%,var(--line));background:color-mix(in srgb,var(--surface2) 90%,var(--accent) 10%);box-shadow:0 9px 24px color-mix(in srgb,var(--shadow) 52%,transparent),0 0 22px color-mix(in srgb,var(--accent) 12%,transparent)}
.bb:hover:not(:disabled)::after{left:136%}
.bb:active:not(:disabled){transform:translateY(0) scale(.985)}
.bb:disabled{opacity:.33;cursor:not-allowed;filter:saturate(.45)}
.header-actions .bb{min-height:44px;padding:0 17px}
.header-actions .import{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:850}
.header-actions .import::before{content:'+';display:inline-block;margin-right:7px;font-size:15px;line-height:0}
.header-actions .export:not(:disabled){background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 58%,var(--accent2)));border-color:transparent;color:#080a10;font-weight:900;box-shadow:0 0 28px color-mix(in srgb,var(--accent) 24%,transparent)}
.header-actions .export::before{content:'↗';display:inline-block;margin-right:7px;font-size:13px}
.header-actions .theme{width:46px;padding:0;font-size:0}
.header-actions .theme::before{content:'◐';font-size:20px;color:var(--accent2)}
.cfg-wrap{position:relative;z-index:1000;display:inline-flex}
.cfg-list{
  position:absolute;top:calc(100% + 10px);right:0;z-index:10000;width:204px;
  margin:0;padding:7px;list-style:none;max-height:280px;overflow-y:auto;
  background:color-mix(in srgb,var(--bg2) 96%,transparent);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 20px 70px rgba(0,0,0,.48),0 0 35px color-mix(in srgb,var(--accent) 16%,transparent),inset 0 1px 0 color-mix(in srgb,var(--fg) 7%,transparent);backdrop-filter:blur(24px) saturate(145%);
}
.cfg-list[hidden]{display:none}
.cfg-list:not([hidden]){animation:menu-pop .22s cubic-bezier(.2,.8,.25,1) both;transform-origin:top right}
.cfg-list li{position:relative;padding:11px 12px 11px 38px;border-radius:9px;color:var(--dim);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .14s,color .14s}
.cfg-list li::before{content:'';position:absolute;left:10px;top:50%;width:12px;height:12px;border-radius:4px;transform:translateY(-50%);background:var(--swatch,#a78bfa);box-shadow:0 0 12px color-mix(in srgb,var(--swatch,#a78bfa) 55%,transparent)}
.cfg-list li[data-v="yellow"]{--swatch:#ffd43b}.cfg-list li[data-v="jade"]{--swatch:#2ee6a8}.cfg-list li[data-v="reddust"]{--swatch:#ff4d6d}.cfg-list li[data-v="seaclear"]{--swatch:#35c9ff}
.cfg-list li:hover{background:var(--surface2);color:var(--fg)}
.cfg-list li.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--fg);font-weight:800}
@keyframes menu-pop{from{opacity:0;transform:translateY(-7px) scale(.96)}to{opacity:1;transform:none}}

/* Sidebar */
.side{
  flex:0 0 250px;width:250px;min-width:0;padding:18px 15px 14px;
  display:flex;flex-direction:column;gap:12px;overflow-x:hidden;overflow-y:auto;
}
.side-intro{padding:1px 5px 7px}.side-intro h2{margin:0;font-size:18px;line-height:1.3;letter-spacing:.2px}
.side-row{display:flex;flex-direction:column;gap:7px;min-width:0}
.mode-card{
  flex-direction:row;align-items:center;justify-content:space-between;gap:10px;
  min-height:62px;padding:11px 11px 11px 13px;border:1px solid var(--line);border-radius:13px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--surface) 86%,transparent),color-mix(in srgb,var(--bg) 54%,transparent));
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 4%,transparent);transition:border-color .18s,transform .18s,box-shadow .18s;
}
.mode-card:hover{border-color:color-mix(in srgb,var(--accent) 58%,var(--line));transform:translateY(-2px);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 8%,transparent),inset 0 1px 0 color-mix(in srgb,var(--fg) 6%,transparent)}
.mode-copy{display:flex;flex-direction:column;gap:4px;min-width:0}.mode-copy .dim{font-size:14px}
.mode-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.mode-toggle{
  min-width:53px;padding:6px 8px;border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line));border-radius:9px;
  background:color-mix(in srgb,var(--accent) 9%,transparent);color:var(--accent);font-size:14px;font-weight:900;text-align:center;cursor:pointer;user-select:none;
  transition:background .16s,color .16s,border-color .16s,box-shadow .16s;
}
.sort-toggle{min-width:53px}
.mode-toggle:hover,.mode-toggle.on{background:color-mix(in srgb,var(--accent) 17%,transparent);border-color:var(--accent);color:var(--fg);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 15%,transparent)}
.side-wms{margin-top:4px;padding-top:15px;border-top:1px solid var(--line);gap:9px}
.side-wms-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.side-wms-head strong{font-size:14px}
.wms-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 5px color-mix(in srgb,var(--muted) 12%,transparent)}
.wms-dot.ok{background:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 12%,transparent),0 0 14px var(--ok);animation:status-pulse 2.2s ease-out infinite}
.wms-dot.err{background:var(--err);box-shadow:0 0 0 5px color-mix(in srgb,var(--err) 12%,transparent)}
.wms-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.side-wms .bb{width:100%;text-align:center}.side-wms .bb.wms-mode{min-height:42px;padding:0 6px;color:var(--dim);font-size:13px}
.side-wms .bb.wms-mode.sel{background:color-mix(in srgb,var(--accent) 20%,var(--surface));border-color:var(--accent);color:var(--fg);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 15%,transparent)}
.wave-input-label{margin-top:3px;color:var(--dim);font-size:13px;font-weight:750}
.side-wms textarea{
  width:100%;min-height:70px;padding:9px 10px;resize:vertical;
  background:color-mix(in srgb,var(--bg) 72%,transparent);color:var(--fg);border:1px solid var(--line);border-radius:11px;
  font-size:13px;line-height:1.6;outline:none;transition:border-color .16s,box-shadow .16s;
}
.side-wms textarea::placeholder{color:var(--muted)}.side-wms textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.side-wms textarea:disabled{opacity:.45}
.side-wms .bb.run{min-height:41px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 52%,var(--accent2)));background-size:180% 180%;border-color:transparent;color:#080a10;font-weight:900}.side-wms .bb.run:not(:disabled){animation:action-pulse 3.2s ease-in-out infinite}.side-wms .bb.run:disabled{background:var(--surface);color:var(--dim)}
.side-wms .wms-log{
  flex:1 1 auto;width:100%;min-height:92px;max-height:230px;padding:9px 10px;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);border-radius:11px;
  color:var(--dim);font-size:12px;line-height:1.7;
}
.wms-log:empty::before{content:'任务日志将在这里实时滚动';color:var(--muted)}
.wms-log .ev{white-space:pre-wrap;word-break:break-all}.wms-log .ev.jobhead{margin:5px 0;color:var(--fg);font-weight:800}.wms-log .ev.link a{color:var(--accent2);text-decoration:none}.wms-log .ev.failed{color:var(--err)}.wms-log .ev.completed{color:var(--ok)}.wms-log .ev.segment_warning,.wms-log .ev.completed_with_warnings{color:var(--warn)}
.side-spacer{flex:1;min-height:4px}.side-status{gap:6px;padding:0 5px}.status{max-width:100%;color:var(--dim);font-size:13px;line-height:1.5;white-space:normal;word-break:break-word}.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.side-status #engineLabelWrap{display:flex;gap:7px;font-size:13px}.ok{color:var(--ok);font-weight:800}.fail{color:var(--err);font-weight:800}.dim{color:var(--dim)}
@keyframes status-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 38%,transparent),0 0 14px var(--ok)}70%,100%{box-shadow:0 0 0 10px transparent,0 0 14px var(--ok)}}
@keyframes action-pulse{0%,100%{background-position:0 50%;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 12%,transparent)}50%{background-position:100% 50%;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 26%,transparent)}}

/* Main dashboard */
.term{position:relative;flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.term::before{content:'';position:absolute;z-index:12;top:0;left:6%;right:6%;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent2),var(--accent),transparent);background-size:220% 100%;box-shadow:0 0 16px color-mix(in srgb,var(--accent2) 40%,transparent);animation:edge-flow 6s linear infinite}
.out{flex:1;display:flex;min-width:0;min-height:0;padding:14px;overflow:hidden}
#dash{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0;height:100%}
.dash-summary{position:relative;flex:0 0 auto;overflow:hidden;display:grid;grid-template-columns:170px 1fr;align-items:stretch;gap:10px;padding:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--surface) 72%,transparent),color-mix(in srgb,var(--accent) 4%,transparent),color-mix(in srgb,var(--surface) 72%,transparent));background-size:220% 100%;border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 5%,transparent);animation:summary-flow 11s ease-in-out infinite}
.dash-summary::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 25%,color-mix(in srgb,var(--fg) 3%,transparent) 43%,transparent 57%);transform:translateX(-100%);animation:summary-sheen 9s ease-in-out infinite}
.summary-title{display:flex;flex-direction:column;justify-content:center;padding:12px 14px}.summary-title strong{font-size:18px}.summary-title span{margin-top:5px;color:var(--dim);font-size:13px}
.metric-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:9px}
.metric{
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:78px;padding:13px 15px;
  background:color-mix(in srgb,var(--bg) 44%,transparent);border:1px solid var(--line);border-radius:13px;
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 4%,transparent);transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;
}
.metric::before{content:'';position:absolute;left:13px;right:13px;top:-1px;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,var(--metric-color,var(--accent)),transparent);opacity:.7;box-shadow:0 0 10px color-mix(in srgb,var(--metric-color,var(--accent)) 42%,transparent)}
